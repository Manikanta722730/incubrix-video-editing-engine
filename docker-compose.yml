services:
  incubrix-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix-video-editor
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - STORAGE_BACKEND=local
      - STORAGE_DIR=/app/data/storage
      - STT_PROVIDER=mock
      - LLM_PROVIDER=rule_based
      - DEFAULT_TIME_POLICY=original_media_time
      - HMAC_SECRET_KEY=incubrix-secure-signature-secret-key-32ch
    volumes:
      - ./data/storage:/app/data/storage
      - ./test_pack/outputs:/app/test_pack/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # S3-Compatible Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: incubrix-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  minio_data:

