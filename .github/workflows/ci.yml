name: IncuBrix Video Editing Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic test assets
        run: |
          python -m test_pack.media.generate_assets
          python -m test_pack.sessions.create_sessions

      - name: Run all automated tests (80 test cases)
        run: |
          python -m tests.run_all

      - name: Run batch runner validation
        run: |
          python -m engine.batch_runner --input test_pack/sessions --output-dir test_pack/outputs

